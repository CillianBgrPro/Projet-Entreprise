version: '3.8'

services:
  # 1. La base de données PostgreSQL
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: local_entreprise_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admincoda2026!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. Ton application Django Virtuorl
  web:
    build: .
    command: python public/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  # 3. L'interface d'administration de la BDD (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@virtuorl.fr
      PGADMIN_DEFAULT_PASSWORD: admincoda2026!
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
